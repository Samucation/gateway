server {
  listen 80;
  server_name _;
  client_max_body_size 2m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # ---- SPA static -------------------------------------------------------
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ---- Reverse proxies for browser-side calls --------------------------
  # All upstreams here are reachable only inside the compose network.
  # The browser never talks to them directly — no CORS to configure on
  # Kong, Keycloak, Prometheus or the app.

  location /api/kong/ {
    proxy_pass http://kong:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/kong-status/ {
    proxy_pass http://kong:8100/;
    proxy_set_header Host $host;
  }

  location /api/app/ {
    proxy_pass http://app:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
  }

  location /api/prom/ {
    proxy_pass http://prometheus:9090/;
    proxy_set_header Host $host;
  }

  location /api/keycloak-admin/ {
    proxy_pass http://keycloak:8080/;
    proxy_set_header Host $host;
  }

  location /api/ops/ {
    proxy_pass http://ops-api:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
  }

  # ---- SPA fallback ----------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
