# O cluster de HOMOLOGAÇÃO desta estação.
#
# ===========================================================================
# POR QUE k3d, E NÃO MicroK8s NEM O KUBERNETES DO DOCKER DESKTOP
# ===========================================================================
# Os manifestos declaram `ingressClassName: traefik`, porque a VM roda MicroK8s
# com o addon `ingress`, que É o Traefik.
#
# • MicroK8s aqui exigiria mais uma VM Linux (esta estação é Windows) — uma
#   camada inteira a mais para manter, com disco e memória próprios.
# • O Kubernetes do Docker Desktop sobe SEM controlador de ingress. Instalar o
#   Traefik à mão funcionaria, mas seria uma segunda instalação para divergir
#   da de lá na primeira atualização.
# • k3d roda k3s em contêiner, e o k3s JÁ TRAZ Traefik. Os mesmos manifestos
#   valem nos dois lados sem uma linha de adaptação — que é o ponto inteiro de
#   ter homologação.
#
# ===========================================================================
# ⚠️ O REGISTRO DE IMAGENS É O DA VM, E ISSO É DE PROPÓSITO
# ===========================================================================
# A esteira roda na VM, constrói a imagem e a publica no registro DE LÁ. Se esta
# estação tivesse registro próprio, a mesma imagem precisaria ser construída (ou
# copiada) duas vezes — e "funciona em homologação mas não em produção" passaria
# a ter uma causa a mais para investigar.
#
# O espelho abaixo faz `localhost:32000` (o que está escrito nos manifestos)
# apontar para o registro da VM. Assim o overlay de hmg e o de prd referenciam a
# MESMA imagem, pelo mesmo nome, e o que foi testado aqui é exatamente o que
# sobe lá.
#
# ⚠️ O IP DA VM ESTÁ FIXO AQUI, e isso é dívida conhecida. Ela está em DHCP e já
# trocou de endereço três vezes em 21/08/2026. Quando trocar, este arquivo
# precisa ser atualizado e o cluster recriado. O conserto de verdade é reserva
# de DHCP no roteador — depende do dono.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: hmg

servers: 1
agents: 0

image: docker.io/rancher/k3s:v1.35.5-k3s1

# ⚠️ Porta da API FIXA, e não a aleatória que o k3d escolhe.
#
# 🐞 Sem isto o k3d sorteia uma porta alta (saiu 49483 na primeira tentativa) e
# ela MUDA a cada recriação do cluster. O Jenkins, que roda na VM e precisa
# publicar aqui, teria um endereço que quebra sozinho — e o erro apareceria como
# "conexão recusada", sem pista de que a porta trocou.
kubeAPI:
  hostPort: "6550"

ports:
  # A porta 80 do Traefik do cluster sai em 8090 na estação. O túnel de
  # homologação aponta para cá.
  #
  # ⚠️ Não é a 80: nesta máquina ela é disputada, e um conflito de porta em
  # cluster aparece como "o cluster subiu mas nada responde".
  - port: 8090:80
    nodeFilters:
      - loadbalancer

registries:
  # ⚠️ SÓ o `mirrors`, SEM bloco `configs`.
  #
  # 🐞 A primeira versão trazia `configs` com `tls.insecure_skip_verify: true`,
  # achando que era isso que liberava um registro sem TLS. É o contrário: a
  # simples presença de `tls` faz o containerd tentar HTTPS. O erro foi
  #
  #   failed to pull: content at https://192.168.15.55:32000/v2/... not found
  #
  # — com `https` no lugar do `http` que está escrito logo abaixo. Um registro
  # que só fala HTTP responde lixo para um handshake TLS, e a mensagem fala de
  # "conteúdo não encontrado", que manda procurar a imagem errada.
  #
  # Para HTTP puro basta o endpoint com `http://`, e nada mais.
  #
  # ---------------------------------------------------------------------------
  # ⚠️ VÁRIOS ENDEREÇOS, e não um só — a VM está em DHCP.
  # ---------------------------------------------------------------------------
  # 🐞 Em 22/08/2026 a VM trocou de `192.168.15.55` para `.56` sozinha, no meio
  # do dia. O espelho continuou apontando para o endereço velho e a homologação
  # parou de conseguir baixar imagem — com o registro perfeitamente de pé, no
  # endereço novo.
  #
  # ⚠️ O sintoma é `ImagePullBackOff`, que faz procurar defeito na imagem, no
  # push ou no manifesto. Nada disso: é o número de telefone que mudou.
  #
  # O containerd tenta os endpoints EM ORDEM e usa o primeiro que responder.
  # Listar a faixa provável custa alguns segundos quando o primeiro está morto, e
  # evita que a próxima troca derrube homologação.
  #
  # ⚠️ Isto é REMENDO, não conserto. O conserto é reserva de DHCP no roteador
  # (ou IP fixo na VM) — ver `gateway/vm/IP-OSCILANDO.md`. Enquanto o endereço
  # oscilar, esta lista é o que segura.
  #
  # ---------------------------------------------------------------------------
  # 🐞 24/08/2026: OS ENDEREÇOS ACIMA ERAM DA VM, QUE NÃO EXISTE MAIS.
  # ---------------------------------------------------------------------------
  # A VM `serverhomol` foi desligada em 23/08 e a produção passou para o k3s da
  # distro WSL2. O espelho continuou apontando para os quatro IPs dela: a
  # homologação não conseguia baixar NENHUMA imagem nova.
  #
  # ⚠️ E não aparecia. Os 47 Pods de hmg seguiam no ar com as imagens que já
  # estavam no nó — o defeito só se manifestaria na próxima implantação, que
  # também não acontecia, porque as etapas de homologação estavam desligadas
  # por outra guarda. Dois defeitos se escondendo um atrás do outro.
  #
  # ---------------------------------------------------------------------------
  # POR QUE UM REGISTRO SÓ PARA A HOMOLOGAÇÃO
  # ---------------------------------------------------------------------------
  # O registro da produção vive DENTRO da distro WSL2, e contêiner do Docker
  # não tem rota até lá — medido: `ping` da distro a partir de um contêiner
  # perde 100% dos pacotes, e a porta 32000 nem responde. As duas distros do
  # WSL só se encontram através do host Windows.
  #
  # Então a homologação ganhou o seu, em Docker, publicado na 32001 — que é
  # endereço que os DOIS lados alcançam:
  #
  #     a distro empurra  ->  192.168.15.9:32001   (porta publicada pelo Docker)
  #     o k3d baixa       ->  host.docker.internal:32001
  #
  # ⚠️ Os dados ficam em `G:\docker-registro-hmg`, e não em volume do Docker: o
  # `C:` já chegou a 0 GB nesta máquina e derrubou tudo. O `G:` tem folga.
  #
  # `host.docker.internal` primeiro DE PROPÓSITO: é nome, não número, e sobrevive
  # à troca de IP da estação — que ainda não tem reserva de DHCP. O IP fica de
  # reserva para o caso de o nome não resolver.
  config: |
    mirrors:
      "localhost:32000":
        endpoint:
          - "http://host.docker.internal:32001"
          - "http://192.168.15.9:32001"

options:
  k3s:
    extraArgs:
      # ⚠️ O certificado da API precisa cobrir o ENDEREÇO DA REDE LOCAL.
      #
      # 🐞 Por padrão o k3d assina o certificado só para `localhost`,
      # `127.0.0.1` e o IP interno do contêiner. O Jenkins roda NA VM e precisa
      # publicar aqui — conectando por `192.168.15.9` ele levaria erro de TLS
      # (`certificate is valid for ...`), que parece problema de credencial e é
      # de certificado.
      #
      # ⚠️ Vários endereços porque esta estação também está em DHCP. É a mesma
      # dívida da VM; o conserto de verdade é reserva no roteador.
      - arg: --tls-san=192.168.15.9
        nodeFilters:
          - server:*
      - arg: --tls-san=192.168.15.10
        nodeFilters:
          - server:*
      - arg: --tls-san=192.168.15.11
        nodeFilters:
          - server:*
      - arg: --tls-san=host.docker.internal
        nodeFilters:
          - server:*
      # 🐞 `--disable=servicelb` ESTAVA AQUI, e quebrava tudo.
      #
      # Eu tirei o Klipper achando que ele abriria portas do HOST e colidiria
      # com o que já roda nesta máquina. Ele NÃO faz isso: ele abre a porta
      # dentro do contêiner do NÓ.
      #
      # E é justamente ele que faz o Service `LoadBalancer` do Traefik escutar
      # na porta 80 do nó — que é para onde o `serverlb` do k3d encaminha o
      # 8090. Sem ele, a porta 8090 aceitava conexão (o serverlb estava de pé) e
      # do outro lado não havia ninguém: `curl` devolvia 000, e o Traefik
      # aparecia `1/1 Running` com o Ingress declarado corretamente.
      #
      # ⚠️ Sintoma que engana: tudo verde no `kubectl`, e nada responde.
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
