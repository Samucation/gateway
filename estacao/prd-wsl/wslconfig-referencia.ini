# Teto de memória do WSL — e por que ele precisa existir
# ---------------------------------------------------------------------------
# Sem este arquivo o WSL não tem teto real: ele cresce, segura cache que já não
# usa, e num certo ponto o Windows fica sem memória para os processos de fora.
# Quem morre primeiro é o Docker Desktop, e o sintoma é o pior possível:
#
#   failed to connect to the docker API at npipe:////./pipe/dockerDesktopLinuxEngine
#
# Parece Docker quebrado. Não é: é o Windows sem memória. Aconteceu duas vezes
# em 13/08/2026, as duas durante `docker compose build` — que é justamente o
# momento de pico.
#
# ATUALIZADO EM 16/08/2026 — a premissa mudou
# ---------------------------------------------------------------------------
# A máquina agora tem 63,7 GB, e não 31,2 GiB. O raciocínio abaixo ("20 GB
# deixa ~11 GB para o Windows") já não descreve esta máquina.
#
# O que o Visualizador de Eventos mostrou em 16/08, no evento 2004:
#   vmmemWSL ......... 27,9 GB   (a VM no TETO: memory 20 + swap 8)
#   Photoshop ........ 14,5 GB
#   Vegas Pro ......... 6,2 GB
#
# Ou seja: não era o Urupix nem outro projeto de contêiner. Era a VM cheia AO
# MESMO TEMPO que os editores de vídeo e imagem. Subir o teto da VM pioraria,
# porque ela tomaria ainda mais quando o Photoshop estivesse aberto.
#
# O que foi feito: o Redpanda do Veltrixa estava sem teto e sozinho consumia
# 2,3 GiB — mais que qualquer outro contêiner de qualquer projeto. Com
# `--memory 1G` ele caiu para ~247 MiB. Enxugar contêiner é o caminho que este
# arquivo já mandava seguir.
#
# Medido em 13/08/2026, com a máquina de 31,2 GiB:
#   vmmemWSL ......... 31,5 GB   (a máquina inteira)
#   Firefox .......... ~7 GB
#   contêineres ...... ~17,3 GiB somados
#
# 20 GB deixa ~11 GB para Windows, navegador e IDE. Se um dia faltar para os
# contêineres, o certo é ENXUGAR contêiner (ver os `mem_limit` nos composes),
# e não subir este número até encostar no teto físico de novo.
[wsl2]
memory=32GB

# ATUALIZADO EM 23/08/2026 - a producao saiu do Docker
# ---------------------------------------------------------------------------
# A producao agora roda em k3s, na distro `prd`, e NAO no Docker Desktop. O
# motivo e poder fechar o Docker para usar o computador sem derrubar portais e
# APIs.
#
# 20 GB nao serve mais para o periodo de transicao: as distros do WSL dividem
# UMA maquina virtual e UM teto. Medido hoje, com o Docker de pe, sobravam 4 GB
# para a producao nova -- ela nao caberia.
#
# 32 GB deixa ~31 GB para o Windows, e a premissa de 16/08 continua valendo:
# o pico ruim e a VM cheia AO MESMO TEMPO que Photoshop e Vegas. Depois da
# virada o Docker fica desligado a maior parte do tempo e o consumo real cai
# para o do k3s sozinho (~16 GB, medido na `serverhomol` com 59 Pods).


# Devolve memória ociosa ao Windows em vez de segurar para sempre.
# `gradual` porque `dropcache` derruba o cache de página inteiro e faz a
# próxima leitura de disco doer — com Postgres dentro, isso se sente.

# Swap dá margem para o pico do build sem estourar a RAM. Não é para uso
# contínuo: se o swap estiver sempre cheio, o problema é o teto acima.
swap=8GB

# Espaço em disco do WSL não é devolvido sozinho quando um contêiner some.
# `sparseVhd` faz o VHDX encolher — sem isso ele só cresce, e um dia a partição
# acaba por causa de imagem que ninguém usa mais há meses.

[experimental]
# ⚠️ ESTAS DUAS VIVEM AQUI, e nao em [wsl2].
# O WSL 2.7 recusa `autoMemoryReclaim` e `sparseVhd` sob [wsl2] com um aviso
# facil de nao ver ("Unknown key"), e segue em frente. Estavam la desde
# 13/08/2026 -- ou seja, a devolucao de memoria ociosa que este arquivo
# descreve nunca esteve ligada de verdade.
autoMemoryReclaim=gradual
sparseVhd=true
hostAddressLoopback=true
