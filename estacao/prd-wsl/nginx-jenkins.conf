# A barreira de senha na frente do Jenkins, na distro `prd`.
#
# ===========================================================================
# POR QUE ELA EXISTE
# ===========================================================================
# A conta que roda o Jenkins está nos grupos `docker` e `k3s` — na prática,
# root nesta máquina. Quem passar da tela de login não ganha "o Jenkins":
# ganha a máquina que roda os dez projetos, inclusive o Urupix, que movimenta
# dinheiro de terceiro.
#
# O que se quer é concreto: que varredor automático não ache uma tela de login
# de CI exposta na internet. Uma senha ANTES da aplicação resolve isso.
#
#     internet → Cloudflare → túnel → nginx :8081 (SENHA) → Jenkins :8080
#
# ⚠️ Esta montagem é a MESMA que existia na VM `serverhomol` e está descrita em
# `gateway/vm/tunel-serverhomol.md`. Ela não veio junto quando a produção mudou
# para esta estação em 24/08/2026, e o resultado foi o Jenkins ficar quatro
# dias em 404 — de pé, respondendo 200 por dentro, e inalcançável.
#
# ===========================================================================
# ⚠️ O Cloudflare Access foi DESCARTADO, e não esquecido
# ===========================================================================
# A tela de plano do Zero Trust pede cartão de crédito mesmo no Free
# (`Due today $0/month`). Não é o caminho aqui.

# ---------------------------------------------------------------------------
# 🐞 O esquema real da requisição não é o que o nginx enxerga.
# ---------------------------------------------------------------------------
# O TLS termina no Cloudflare; o `cloudflared` entrega HTTP puro aqui. Se o
# Jenkins receber `X-Forwarded-Proto: http`, ele monta as URLs absolutas dele em
# http — e o navegador, que está em https, recusa o conteúdo misto. O sintoma é
# página sem CSS e botão que não responde, que parece tema quebrado.
#
# Usar `https` fixo também não serve: pelo acesso LOCAL (http://localhost:8081)
# o Jenkins passaria a montar https contra uma porta que não fala TLS.
#
# Então: respeita o cabeçalho de quem veio de fora, e cai no esquema real
# quando não há nenhum (que é o caso do acesso local).
map $http_x_forwarded_proto $esquema_real {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket. O Jenkins usa para o console ao vivo e para o canal dos agentes;
# sem isto o log de build congela na tela e só anda com F5.
map $http_upgrade $conexao_upgrade {
    default upgrade;
    ""      close;
}

server {
    # ⚠️ 8081, e não 80: a porta 80 desta distro é do Kong (Pod, hostPort), que
    # é a entrada da produção. Disputar essa porta derrubaria dez domínios.
    listen 8081;
    listen [::]:8081;

    server_name jenkins.cursodetecnologia.dev.br localhost;

    # O Jenkins serve artefato e recebe upload de plugin; o padrão de 1 MB
    # devolveria 413 no meio de uma operação legítima.
    client_max_body_size 100m;

    # ⚠️ O realm NÃO se chama "Jenkins", de propósito.
    #
    # 🐞 Na VM ele se chamava, e os dois `401` da pilha (o do nginx e o do
    # Jenkins) ficavam indistinguíveis: só se separavam pelo `charset` no
    # `WWW-Authenticate`. Quem estava na cadeira não tinha como saber QUAL das
    # duas senhas o navegador estava pedindo.
    auth_basic           "prd - acesso externo ao CI";
    auth_basic_user_file /etc/nginx/jenkins.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # -------------------------------------------------------------------
        # 🐞 ESTA LINHA NÃO É OPCIONAL, E A FALTA DELA PARECE SENHA ERRADA.
        # -------------------------------------------------------------------
        # Sem limpar o cabeçalho, o nginx repassa o `Authorization` para cima e
        # o Jenkins tenta autenticar o usuário do nginx como usuário DELE.
        # Resultado: senha correta e `401` assim mesmo.
        #
        # A barreira do nginx já cumpriu o papel dela; daqui para cima a
        # requisição sobe limpa.
        proxy_set_header Authorization "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexao_upgrade;

        # Build longo mantém a conexão aberta sem trafegar nada. O padrão de
        # 60s cortaria o console ao vivo no meio.
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }
}
