# A ESTEIRA CEDE A VEZ PARA A PRODUCAO.
#
# Drop-in do systemd para o `buildkit.service`. Instalar com:
#
#   sudo mkdir -p /etc/systemd/system/buildkit.service.d
#   sudo cp buildkit-cede-a-vez.conf \
#        /etc/systemd/system/buildkit.service.d/prioridade.conf
#   sudo systemctl daemon-reload && sudo systemctl restart buildkit
#
# ===========================================================================
# POR QUE ISTO EXISTE
# ===========================================================================
# A esteira e o cluster de PRODUCAO dividem o mesmo disco desta estacao.
# Durante o `docker build`, o buildkitd descompacta camadas e escreve no
# snapshotter, e a pressao de I/O da maquina passa de 75%. A partir dai:
#
#   • o kubelet nao consegue bater o ponto e o no vai a `NodeNotReady`;
#   • `pg_isready` e `redis-cli ping` estouram o limite de 1s das sondas;
#   • o gerente de taints comeca a contar para DESPEJAR pods de producao;
#   • e um teste da esteira chegou a estourar 30 SEGUNDOS para inserir uma
#     linha (builds #69 e #70, 05/09/2026).
#
# ⚠️ E em 04/09/2026 isso foi ate o fim: a 83% de pressao o descompactar
# TRUNCOU BINARIOS EM SILENCIO -- um executavel de 19,8 MB virou 0 byte -- e o
# cluster inteiro caiu. Nao houve erro em lugar nenhum: o build ficou verde.
#
# ===========================================================================
# O QUE MUDA
# ===========================================================================
# `best-effort` na pior prioridade (7): o buildkitd continua andando, mas perde
# a disputa para todo o resto -- inclusive para o kubelet e para os bancos de
# producao, que usam a prioridade padrao (4).
#
# 🐞 A primeira versao usava `idle`, e foi LONGE DEMAIS. Na classe ociosa o
# processo so recebe disco quando NINGUEM mais quer, e num no com 40 Pods
# fazendo I/O miudo o tempo todo isso quase nunca acontece: o `Construir` do
# sigma-financeiro passou de ~10 para 26 minutos, e com um executor so isso
# vira fila de horas. Ceder a vez nao pode virar passar fome.
#
# ⚠️ O alvo e o BUILDKITD, e nao o Jenkins: quem descompacta camada e ele, num
# processo proprio. Rebaixar o Jenkins nao alcanca o trabalho pesado.
#
# ⚠️ E NAO se rebaixa o containerd do k3s: e ele que serve os Pods de
# producao. Rebaixa-lo seria trocar o problema de lugar.
[Service]
IOSchedulingClass=best-effort
IOSchedulingPriority=7
Nice=10
