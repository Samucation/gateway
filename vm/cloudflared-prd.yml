  #
  # UM NIVEL SO de subdominio, com hifen no sandbox. O SSL grátis da Cloudflare
  # cobre *.cursodetecnologia.dev.br e NAO cobre a.b.cursodetecnologia...;
  # dois niveis exigiriam o Advanced Certificate Manager (~US$ 10/mes). O
  # sintoma de errar nao e um erro claro: e certificado invalido no navegador
