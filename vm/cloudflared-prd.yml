  # sigma-midia - armazenamento de arquivos agnostico de aplicacao.
  # Publicado em 17/08/2026, pedido pelo Samuel.
  #
  # Entra pelo GATEWAY UNICO (8050), como os demais: e o gateway que faz
  # correlacao, teto por IP e metricas. Apontar direto para o nginx do portal
  # (4400) funcionaria e jogaria essa camada fora sem ninguem perceber.
  #
  # O que responde por este dominio: as paginas do portal, /api/portal
  # (cadastro publico) e /api/admin (operacao, com teto apertado). A API das
  # aplicacoes (/api/v1) tambem, autenticada por X-Api-Key.
  #
  # ⚠️ O BYTE DO ARQUIVO NAO PASSA POR AQUI. O servico devolve URL assinada e o
  # cliente faz o PUT direto no motor de objetos. Enquanto o motor nao tiver
  # endereco publico proprio, so da para enviar de dentro da maquina.
  #
  # UM NIVEL SO de subdominio: o SSL gratis da Cloudflare cobre
  # *.cursodetecnologia.dev.br e nao cobre a.b.cursodetecnologia...
  - hostname: sigma-midia.cursodetecnologia.dev.br
    service: http://localhost:8050
    originRequest:
      httpHostHeader: sigma-midia.cursodetecnologia.dev.br

  # sigma-midia - o hostname de DADOS. Aqui passam os BYTES.
  #
  # No plano dos "dois hostnames, como o S3": o de cima e o de CONTROLE (portal
  # e API); este e o de dados. Nele moram dois destinos, separados por PREFIXO
  # de caminho -- por isso sao duas regras, e a ORDEM importa (vence a primeira
  # que casa).
  #
  # ⚠️ NAO passa pelo gateway (8050), de proposito. O Kong desta maquina tem
  # teto de 1 MB nas rotas do sigma-midia, porque por la so trafega JSON de
  # controle. Mandar arquivo pelo gateway daria 413 e jogaria fora o desenho
  # inteiro: o servico existe justamente para o byte NAO passar por ele.
  #
  # ⚠️ SEM httpHostHeader reescrito para localhost. O cabecalho Host entra na
  # assinatura SigV4 do MinIO: se o tunel trocar o cabecalho, TODA URL
  # assinada passa a dar 403 -- e o erro diria "acesso negado", nao "host
  # errado".
  #
  # Exposicao conferida em 17/08/2026 antes de publicar: sem assinatura o
  # MinIO devolve 403 em GET, LIST, PUT e DELETE, e o console (9101) nao
  # responde por esta porta.

  # 1) imagens derivadas (imgproxy). Casa com IMGPROXY_PATH_PREFIX=/img.
  - hostname: sigma-midia-arquivos.cursodetecnologia.dev.br
    path: ^/img(/.*)?$
    service: http://localhost:9102
    originRequest:
      httpHostHeader: sigma-midia-arquivos.cursodetecnologia.dev.br

  # 2) o resto e o motor de objetos (MinIO), so por URL assinada.
  - hostname: sigma-midia-arquivos.cursodetecnologia.dev.br
    service: http://localhost:9100
    originRequest:
      httpHostHeader: sigma-midia-arquivos.cursodetecnologia.dev.br

  # Sprinkle Games - portal publico (sprinklegames.com.br), 20/08/2026.
  # A API serve o site ja compilado na MESMA porta (SERVE_WEB=true), entao
  # aponta direto pro 4310 e nao passa pelo gateway: uma origem so mantem o
  # cookie de sessao em SameSite=Lax e tira o CORS do caminho.
  - hostname: sprinklegames.com.br
    service: http://localhost:4310
    originRequest:
      httpHostHeader: sprinklegames.com.br

  - hostname: www.sprinklegames.com.br
    service: http://localhost:4310
    originRequest:
      httpHostHeader: www.sprinklegames.com.br
  # Sempre Mais Barato - portal e API na mesma origem.
  - hostname: sempre-mais-barato.cursodetecnologia.dev.br
    service: http://localhost:4320
    originRequest:
      httpHostHeader: sempre-mais-barato.cursodetecnologia.dev.br
  - service: http_status:404
