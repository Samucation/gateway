  # Veltrixa Ecommerce - LOJA publica (storefront, porta 4201).
  # Autorizado pelo Samuel em 2026-08-07.
  # Registrado em system-api/docs/exposicao-publica.md (regra R17).
  #
  # SO a loja. Painel e Keycloak NAO estao publicados. O nginx da imagem
  # do storefront faz proxy apenas de /api/public/ e devolve 404 no resto
  # da API - carrinho, pedido, pagamento, painel e Swagger ficam de fora.
  - hostname: ninjasystem.cursodetecnologia.dev.br
    service: http://localhost:4201
    originRequest:
      httpHostHeader: ninjasystem.cursodetecnologia.dev.br
  # veltrixa.cursodetecnologia.dev.br - o MESMO storefront (4201), com o nome do
  # produto. Autorizado pelo Samuel em 2026-08-08. O `ninjasystem` continua
  # valendo em paralelo: derrubar um endereco que ja esta no ar quebraria
  # qualquer link compartilhado, e nao custa nada manter os dois.
  #
  # Continua sendo SO A LOJA: o nginx do storefront so passa /api/public/ e
  # devolve 404 no resto. Painel, Keycloak e API direta seguem fora.
  # ⚠️ 8050, e nao 4201: a 4201 era o conteiner do storefront no Docker.
  # Com a producao no k3s, quem serve este nome e o Ingress do cluster --
  # e a 8050 e a porta que o Windows encaminha para o Traefik de la.
  - hostname: veltrixa.cursodetecnologia.dev.br
    service: http://localhost:8050
    originRequest:
      httpHostHeader: veltrixa.cursodetecnologia.dev.br
  # Keycloak do Veltrixa (loja ninjasystem). Publicado em 2026-08-08,
  # autorizado pelo Samuel, para o vendedor Luiz conseguir logar e fechar
  # pedido de fora. Registrado em system-api/docs/exposicao-publica.md (R17).
  #
  # ALLOWLIST DE PATH. Um Keycloak inteiro na internet entrega o console de
  # admin e o realm master junto; aqui so o realm da loja e os estaticos da
  # tela de login atravessam, o resto morre na BORDA, antes do Keycloak.
  # O console de admin continua no localhost via KC_HOSTNAME_ADMIN.
  - hostname: ninjasystem-auth.cursodetecnologia.dev.br
    path: ^/realms/veltrixa(/.*)?$
    service: http://localhost:8085
    originRequest:
      httpHostHeader: ninjasystem-auth.cursodetecnologia.dev.br
  # CSS/JS da tela de login do Keycloak. Sem isto a pagina abre sem estilo.
  - hostname: ninjasystem-auth.cursodetecnologia.dev.br
    path: ^/resources/.*
    service: http://localhost:8085
    originRequest:
      httpHostHeader: ninjasystem-auth.cursodetecnologia.dev.br
  # Qualquer outra coisa neste hostname: /admin/, /realms/master/, metricas.
  - hostname: ninjasystem-auth.cursodetecnologia.dev.br
    service: http_status:404

