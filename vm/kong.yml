# GERADO por vm/gerar-kong-vm.mjs a partir de ../kong/kong.yml — NAO editar.
#
# Este e o Kong que roda DENTRO do cluster da maquina remota. A unica
# diferenca para o da estacao e o destino de cada service: nome de container
# Docker virou nome de Service do Kubernetes.
#
# Para mudar uma rota, mude no kong.yml do PROJETO, rode scripts/gerar-kong.mjs
# e depois este. Editar aqui faz a mudanca sumir na proxima geracao.
_format_version: "3.0"
_transform: true
plugins: []
services:
  - name: liveflow-sse
    url: http://urupix-app.urupix.svc.cluster.local:3100
    retries: 0
    connect_timeout: 3000
    write_timeout: 3600000
    read_timeout: 3600000
    routes:
      - name: liveflow-overlay-streams
        paths:
          - /api/overlay/stream
          - /api/overlay/goal-stream
        strip_path: false
        preserve_host: true
        methods:
          - GET
        plugins:
          - name: rate-limiting
            config:
              minute: 600
              policy: local
              fault_tolerant: true
              limit_by: ip
        hosts:
          - urupix.com.br
          - www.urupix.com.br
          - urupix.cursodetecnologia.dev.br
          - urupix.interno
    plugins:
      - name: correlation-id
        config:
          header_name: X-Request-Id
          generator: uuid
          echo_downstream: true
      - name: cors
        config:
          origins:
            - https://urupix.com.br
            - https://urupix.cursodetecnologia.dev.br
            - http://localhost:3100
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Idempotency-Key
            - X-Request-Id
          exposed_headers:
            - X-Request-Id
            - Retry-After
          credentials: true
          max_age: 3600
      - name: prometheus
        config:
          per_consumer: false
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true
      - name: response-transformer
        config:
          remove:
            headers:
              - X-Kong-Upstream-Latency
              - X-Kong-Proxy-Latency
              - Via
      - name: request-size-limiting
        config:
          allowed_payload_size: 12
          size_unit: megabytes
