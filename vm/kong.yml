  - name: plataforma-api
    url: http://plataforma-app.plataforma.svc.cluster.local:8080
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    retries: 2
    routes:
      - name: plataforma-api-mensageria
        paths:
          - /v1/messaging
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        hosts:
          - opuschat.cursodetecnologia.dev.br
          - cafe-api.cursodetecnologia.dev.br
        plugins:
          - name: rate-limiting
            config:
              minute: 600
              hour: 20000
              policy: local
              limit_by: header
              header_name: Authorization
              fault_tolerant: true
              hide_client_headers: false
          - name: cors
            config:
              origins:
                - http://localhost:8000
                - http://localhost:8080
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Idempotency-Key
                - X-Client-Name
                - X-Request-Id
              exposed_headers:
                - X-Request-Id
                - RateLimit-Remaining
              credentials: false
              max_age: 3600
          - name: response-transformer
            config:
              add:
                headers:
                  - "Content-Security-Policy: default-src 'none';
                    frame-ancestors 'none'"
                  - "X-Content-Type-Options: nosniff"
              remove:
                headers:
                  - X-Powered-By
                  - Server
