<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esteiras — visão geral</title>
<link rel="stylesheet" href="painel.css">
<!--
  ⚠️ NADA de estilo ou script EMBUTIDO neste arquivo.

  🐞 A primeira versão tinha o JavaScript aqui dentro, e a página abria em
  branco. O Jenkins serve `/userContent` com `default-src 'none'`, que bloqueia
  todo script embutido — o navegador descartava o código em silêncio.

  Com estilo e script em arquivos próprios, a política pode ser
  `script-src 'self'; style-src 'self'`, que libera exatamente estes dois e mais
  nada. A alternativa preguiçosa (`unsafe-inline`) liberaria script embutido em
  QUALQUER arquivo servido por `/userContent`.
-->
</head>
<body>

<h1>Esteiras — visão geral</h1>
<div class="sub" id="sub">carregando…</div>

<div class="barra-topo">
  <div class="resumo" id="resumo"></div>
  <button id="permitir">🔔 avisar quando terminar</button>
</div>

<div class="grade" id="grade"></div>

<div class="grafico">
  <div style="font-weight:640;margin-bottom:9px">Últimas 20 execuções de cada projeto</div>
  <div id="barras"></div>
  <div class="aviso">
    Verde: passou. Vermelho: quebrou. Cinza: interrompida — normalmente porque a
    fila foi cancelada ou o Jenkins reiniciou; não é falha do projeto.
  </div>
</div>

<div class="veu" id="veu" hidden>
  <div class="dialogo">
    <h2 id="dlg-titulo"></h2>
    <p id="dlg-texto"></p>
    <div class="botoes">
      <button id="dlg-nao">Cancelar</button>
      <button id="dlg-sim" class="perigo">Parar mesmo assim</button>
    </div>
  </div>
</div>

<script src="painel.js"></script>
</body>
</html>
