<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esteiras — visão geral</title>
<!--
  ===========================================================================
  PAINEL PRÓPRIO DAS ESTEIRAS

  Servido pelo próprio Jenkins, em /userContent/painel/painel.html

  ---------------------------------------------------------------------------
  POR QUE EXISTE, SE JÁ HÁ O "Painel" DO PLUGIN
  ---------------------------------------------------------------------------
  O mural do `build-monitor-plugin` responde duas das três perguntas: se está
  rodando, e como terminou a última. Ele NÃO diz em que FASE a execução está —
  e é justamente essa a pergunta de quem está esperando: "travou ou só demora?"

  E não soma nada entre projetos. Quantas passaram e quantas quebraram no
  conjunto é uma pergunta que ninguém conseguia responder sem abrir dez telas.

  ---------------------------------------------------------------------------
  ⚠️ NÃO GUARDA CREDENCIAL
  ---------------------------------------------------------------------------
  Todas as chamadas usam a sessão do navegador que já está aberta. A página é
  servida pelo mesmo endereço do Jenkins, então o cookie e a autenticação do
  nginx na borda viajam sozinhos.

  Se esta página pedisse um token, ela viraria um segredo a mais para vazar —
  e ficaria desatualizada na primeira rotação.
  ===========================================================================
-->
<style>
  :root {
    --fundo: #12161c;
    --cartao: #1b2028;
    --linha: #2a313c;
    --texto: #e6e9ee;
    --fraco: #8b95a5;
    --ok: #3fb950;
    --erro: #f85149;
    --rodando: #58a6ff;
    --abortado: #8b949e;
    --instavel: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: var(--fundo); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--fraco); font-size: 13px; margin-bottom: 18px; }

  .resumo { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .caixa {
    background: var(--cartao); border: 1px solid var(--linha);
    border-radius: 10px; padding: 12px 16px; min-width: 116px;
  }
  .caixa .n { font-size: 26px; font-weight: 680; line-height: 1.1; }
  .caixa .r { color: var(--fraco); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }

  .grade { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .esteira {
    background: var(--cartao); border: 1px solid var(--linha);
    border-left: 4px solid var(--abortado);
    border-radius: 10px; padding: 14px 16px;
  }
  .esteira.ok       { border-left-color: var(--ok); }
  .esteira.erro     { border-left-color: var(--erro); }
  .esteira.rodando  { border-left-color: var(--rodando); }
  .esteira.instavel { border-left-color: var(--instavel); }

  .topo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .nome { font-weight: 640; }
  .nome a { color: inherit; text-decoration: none; }
  .nome a:hover { text-decoration: underline; }
  .quando { color: var(--fraco); font-size: 12px; white-space: nowrap; }

  .estado { font-size: 13px; margin-top: 3px; }
  .estado.ok { color: var(--ok); } .estado.erro { color: var(--erro); }
  .estado.rodando { color: var(--rodando); } .estado.instavel { color: var(--instavel); }
  .estado.abortado { color: var(--abortado); }

  /* As fases: uma bolinha por etapa, na ordem em que rodam. */
  .fases { display: flex; gap: 3px; margin-top: 10px; flex-wrap: wrap; }
  .fase {
    height: 6px; flex: 1 1 8px; min-width: 8px; border-radius: 3px;
    background: #303845;
  }
  .fase.ok { background: var(--ok); }
  .fase.erro { background: var(--erro); }
  .fase.agora { background: var(--rodando); animation: pulsa 1.1s ease-in-out infinite; }
  .fase.pulada { background: #3a2f1a; }
  @keyframes pulsa { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  .agora-nome { margin-top: 7px; font-size: 12px; color: var(--rodando); }
  .agora-nome b { font-weight: 640; }

  /* O gráfico: uma barra por projeto, verde e vermelho proporcionais. */
  .grafico { margin-top: 26px; background: var(--cartao); border: 1px solid var(--linha); border-radius: 10px; padding: 16px; }
  .barra-linha { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
  .barra-nome { width: 168px; color: var(--fraco); text-align: right; flex: none; }
  .barra { flex: 1; height: 15px; border-radius: 4px; overflow: hidden; display: flex; background: #262d38; }
  .barra i { display: block; height: 100%; }
  .barra .v { background: var(--ok); }
  .barra .x { background: var(--erro); }
  .barra .a { background: var(--abortado); }
  .barra-num { width: 116px; color: var(--fraco); font-size: 12px; flex: none; }

  .aviso { color: var(--fraco); font-size: 12px; margin-top: 16px; }
  .erro-carga { color: var(--erro); }
</style>
</head>
<body>

<h1>Esteiras — visão geral</h1>
<div class="sub" id="sub">carregando…</div>

<div class="resumo" id="resumo"></div>
<div class="grade" id="grade"></div>

<div class="grafico">
  <div style="font-weight:640;margin-bottom:10px">Últimas 20 execuções de cada projeto</div>
  <div id="barras"></div>
  <div class="aviso">
    Verde: passou. Vermelho: quebrou. Cinza: interrompida — normalmente porque a
    fila foi cancelada ou o Jenkins reiniciou; não é falha do projeto.
  </div>
</div>

<div class="aviso" id="rodape"></div>

<script>
// ⚠️ Caminho RELATIVO de propósito: a página é servida pelo próprio Jenkins,
// então isto funciona igual pelo túnel, por IP ou por localhost — e nunca
// aponta para o Jenkins errado.
const RAIZ = new URL('../../', location.href).pathname;

const QUANTAS = 20;

async function pegar(caminho) {
  const r = await fetch(RAIZ + caminho, { credentials: 'same-origin' });
  if (!r.ok) throw new Error(caminho + ' devolveu ' + r.status);
  return r.json();
}

function classeDe(resultado, rodando) {
  if (rodando) return 'rodando';
  switch (resultado) {
    case 'SUCCESS':  return 'ok';
    case 'FAILURE':  return 'erro';
    case 'UNSTABLE': return 'instavel';
    default:         return 'abortado';
  }
}

function textoDe(resultado, rodando) {
  if (rodando) return 'rodando agora';
  switch (resultado) {
    case 'SUCCESS':  return 'passou';
    case 'FAILURE':  return 'quebrou';
    case 'UNSTABLE': return 'passou com ressalva';
    case 'ABORTED':  return 'interrompida';
    default:         return resultado || 'sem execução';
  }
}

function quando(ms) {
  if (!ms) return '';
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return 'agora há pouco';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60);
  if (h < 48) return h + ' h';
  return Math.floor(h / 24) + ' d';
}

async function carregar() {
  const sub = document.getElementById('sub');
  let jobs;
  try {
    // A visão já filtra os jobs `main` de todos os projetos.
    const v = await pegar('view/Painel/api/json?tree=jobs[name,url,fullName]');
    jobs = v.jobs || [];
  } catch (e) {
    sub.innerHTML = '<span class="erro-carga">não consegui falar com o Jenkins: ' + e.message + '</span>';
    return;
  }

  const grade = document.getElementById('grade');
  const barras = document.getElementById('barras');
  grade.innerHTML = '';
  barras.innerHTML = '';

  let nOk = 0, nErro = 0, nRodando = 0, nOutro = 0;

  // Em paralelo: dez projetos em série levariam dez idas ao servidor.
  const dados = await Promise.all(jobs.map(async (j) => {
    const base = new URL(j.url).pathname;
    const fora = { job: j, ultima: null, etapas: [], historico: [] };
    try {
      fora.ultima = await pegar(base.slice(1) + 'lastBuild/api/json?tree=number,building,result,timestamp');
    } catch (e) { /* projeto sem execução ainda */ }
    try {
      const d = await pegar(base.slice(1) + 'lastBuild/wfapi/describe');
      fora.etapas = d.stages || [];
    } catch (e) { /* build sem etapas registradas */ }
    try {
      const h = await pegar(base.slice(1) + 'api/json?tree=builds[result,building]{0,' + QUANTAS + '}');
      fora.historico = h.builds || [];
    } catch (e) { /* sem histórico */ }
    return fora;
  }));

  for (const d of dados) {
    const rodando = !!(d.ultima && d.ultima.building);
    const resultado = d.ultima ? d.ultima.result : null;
    const cls = classeDe(resultado, rodando);

    if (rodando) nRodando++;
    else if (cls === 'ok') nOk++;
    else if (cls === 'erro') nErro++;
    else nOutro++;

    const agora = d.etapas.find((s) => s.status === 'IN_PROGRESS');

    const bolinhas = d.etapas.map((s) => {
      let c = '';
      if (s.status === 'SUCCESS') c = 'ok';
      else if (s.status === 'FAILED') c = 'erro';
      else if (s.status === 'IN_PROGRESS') c = 'agora';
      else if (s.status === 'SKIPPED' || s.status === 'NOT_EXECUTED') c = 'pulada';
      return '<span class="fase ' + c + '" title="' + s.name + ': ' + s.status + '"></span>';
    }).join('');

    const el = document.createElement('div');
    el.className = 'esteira ' + cls;
    el.innerHTML =
      '<div class="topo">' +
        '<span class="nome"><a href="' + new URL(d.job.url).pathname + '">' +
          d.job.fullName.replace('/main', '') + '</a></span>' +
        '<span class="quando">' + (d.ultima ? '#' + d.ultima.number + ' · ' + quando(d.ultima.timestamp) : '') + '</span>' +
      '</div>' +
      '<div class="estado ' + cls + '">' + textoDe(resultado, rodando) + '</div>' +
      (bolinhas ? '<div class="fases">' + bolinhas + '</div>' : '') +
      (agora ? '<div class="agora-nome">fase: <b>' + agora.name + '</b></div>' : '');
    grade.appendChild(el);

    // ---- a barra do gráfico ------------------------------------------------
    const h = d.historico.filter((b) => !b.building);
    const v = h.filter((b) => b.result === 'SUCCESS').length;
    const x = h.filter((b) => b.result === 'FAILURE' || b.result === 'UNSTABLE').length;
    const a = h.length - v - x;
    const t = h.length || 1;

    const linha = document.createElement('div');
    linha.className = 'barra-linha';
    linha.innerHTML =
      '<div class="barra-nome">' + d.job.fullName.replace('/main', '') + '</div>' +
      '<div class="barra">' +
        '<i class="v" style="width:' + (v / t * 100) + '%"></i>' +
        '<i class="x" style="width:' + (x / t * 100) + '%"></i>' +
        '<i class="a" style="width:' + (a / t * 100) + '%"></i>' +
      '</div>' +
      '<div class="barra-num">' + v + ' ok · ' + x + ' erro' + (a ? ' · ' + a + ' int.' : '') + '</div>';
    barras.appendChild(linha);
  }

  document.getElementById('resumo').innerHTML =
    caixa(nRodando, 'rodando', 'var(--rodando)') +
    caixa(nOk, 'passou', 'var(--ok)') +
    caixa(nErro, 'quebrou', 'var(--erro)') +
    caixa(nOutro, 'outros', 'var(--abortado)');

  sub.textContent = jobs.length + ' esteiras · atualiza sozinho a cada 10 s';
  document.getElementById('rodape').textContent =
    'Última leitura: ' + new Date().toLocaleTimeString('pt-BR');
}

function caixa(n, rotulo, cor) {
  return '<div class="caixa"><div class="n" style="color:' + cor + '">' + n +
         '</div><div class="r">' + rotulo + '</div></div>';
}

carregar();
setInterval(carregar, 10000);
</script>
</body>
</html>
