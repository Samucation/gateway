# ===========================================================================
# A entrada da observabilidade, e o apelido que liga os projetos a ela.
#
# ---------------------------------------------------------------------------
# UMA PILHA, NAO UMA POR PROJETO
# ---------------------------------------------------------------------------
# O `docker-compose` do sigma-payments trazia Prometheus, Grafana, Loki,
# Promtail e Jaeger proprios. Cada projeto que fizesse igual teria os seus.
#
# Cinco copias de Prometheus, uma por namespace, seria desperdicio de memoria
# e -- pior -- cinco lugares para olhar quando algo desse errado. No dia de um
# incidente, "em qual Grafana eu vejo isso?" e uma pergunta que ninguem deveria
# precisar fazer.
#
# A pilha vem do complemento `observability` do MicroK8s (kube-prometheus-stack
# + Loki + Tempo). Usar o que a plataforma mantem e melhor que montar a mao:
# ela ja traz `kube-state-metrics` e `node-exporter` configurados, e as
# atualizacoes vem junto.
#
# Custo medido em 20/08/2026: 1,1 GB de memoria para os 9 Pods -- menos que os
# 2 a 3 GB que a documentacao sugere.
#
# ---------------------------------------------------------------------------
# ⚠️ O QUE ELE COLHE HOJE, E O QUE FALTA
# ---------------------------------------------------------------------------
# Colhe o CLUSTER: uso de CPU e memoria por Pod, reinicios, estado, disco, no.
# E isso ja e a maior parte do que se quer olhar quando algo vai mal.
#
# NAO colhe as metricas das APLICACOES. Medido: `/actuator/prometheus` do
# Veltrixa devolve 401 -- ele so e liberado por um interruptor de
# desenvolvimento.
#
# Isso e trabalho POR PROJETO e nao foi feito: liberar rota de metrica muda a
# superficie exposta de cada um, e merece ser decidido em cada um. Hoje so as
# aplicacoes Spring tem o que colher; as de Node (opuschat, urupix,
# sprinklegames, portal do central-ia) nao expoem metrica nenhuma, entao para
# elas nao ha o que ligar antes de haver o que medir.
#
# ---------------------------------------------------------------------------
# 🐞 E NAO E POR ANOTACAO. Esta nota dizia `prometheus.io/scrape`, e ERRAVA
# ---------------------------------------------------------------------------
# `prometheus.io/scrape` e a convencao do Prometheus instalado a mao, onde
# alguem escreve o `kubernetes_sd_config` e as regras de relabel que leem a
# anotacao. O kube-prometheus-stack NAO traz essas regras: ele descobre alvo
# por CRD, com um `ServiceMonitor` (ou `PodMonitor`) por aplicacao.
#
# Anotar os Pods aqui seria pior que nao fazer nada -- os manifestos ficariam
# com cara de instrumentados, o Grafana continuaria sem os dados, e ninguem
# ligaria uma coisa na outra.
#
# ⚠️ E ha uma segunda armadilha, ainda mais calada. O grafico do Helm liga
# `serviceMonitorSelectorNilUsesHelmValues`, que faz o Prometheus aceitar SO os
# ServiceMonitor que tenham o rotulo do release dele. Sem o rotulo o objeto e
# criado com sucesso, aparece no `kubectl get servicemonitor`, e e ignorado --
# nao ha erro, nao ha evento, e o alvo simplesmente nunca aparece.
#
# O release aqui e `kube-prom-stack` (deduzido do nome dos Services abaixo).
# Confirme antes de usar, e um comando:
#
#     microk8s kubectl get prometheus -n observability \
#       -o jsonpath='{.items[0].spec.serviceMonitorSelector}'; echo
#
# Entao o molde e:
#
#     apiVersion: monitoring.coreos.com/v1
#     kind: ServiceMonitor
#     metadata:
#       name: veltrixa-api
#       namespace: veltrixa
#       labels:
#         release: kube-prom-stack     # <- sem isto, ignorado em silencio
#     spec:
#       selector:
#         matchLabels: { app: veltrixa-api }
#       endpoints:
#         - port: http                 # o NOME da porta no Service, nao o numero
#           path: /actuator/prometheus
#
# Depois de aplicar, a prova nao e o `kubectl get`: e o alvo aparecer em
# prometheus.hmg/targets com estado `up`.
# ===========================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observabilidade
  namespace: observability
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.hmg
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prom-stack-grafana
                port:
                  number: 80

    # ⚠️ O Prometheus tem hostname PROPRIO, e nao um caminho dentro do Grafana.
    #
    # Servi-lo sob `/prometheus` exigiria dizer a ele que ele vive num
    # subcaminho (`--web.external-url`), senao os redirecionamentos dele saem
    # sem o prefixo e a interface quebra em paginas soltas. Hostname proprio
    # custa uma linha no `hosts` e evita esse tipo inteiro de problema.
    - host: prometheus.hmg
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prom-stack-kube-prome-prometheus
                port:
                  number: 9090
